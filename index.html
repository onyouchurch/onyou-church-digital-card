<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">

  <meta property="og:type" content="website">

  <meta property="og:locale" content="ko_KR">
  <style>
    :root {
      --ink: #162033;
      --muted: #5c667a;
      --soft: #eef4f8;
      --line: rgba(22, 32, 51, 0.12);
      --brand: #176f7a;
      --brand-deep: #0e5360;
      --gold: #d5aa4d;
      --white: #ffffff;
      --shadow: 0 24px 70px rgba(28, 54, 74, 0.18);
      --radius: 24px;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Noto Sans KR", "Apple SD Gothic Neo", sans-serif;
      color: var(--ink);
      background: #eaf2f4;
      line-height: 1.55;
    }

    a {
      color: inherit;
      text-decoration: none;
    }

    button {
      font: inherit;
    }

    .page {
      min-height: 100vh;
      padding: 28px 16px;
      display: grid;
      place-items: center;
      background:
        linear-gradient(180deg, rgba(255,255,255,0.04), rgba(255,255,255,0.9)),
        url("./KakaoTalk_20260216_144356571_02.jpg") center / cover fixed;
    }

    .card {
      width: min(100%, 440px);
      overflow: hidden;
      border: 1px solid rgba(255,255,255,0.72);
      border-radius: var(--radius);
      background: rgba(255,255,255,0.92);
      box-shadow: var(--shadow);
      backdrop-filter: blur(18px);
    }

    .church-header {
      padding: 18px 22px;
      color: var(--white);
      background: var(--brand-deep);
      font-size: 18px;
      font-weight: 900;
      line-height: 1.35;
      text-align: center;
      word-break: keep-all;
    }

    .hero {
      position: relative;
      height: 410px;
      overflow: hidden;
      background: #dbeaf0;
    }

    .church-photo {
      width: 100%;
      height: 100%;
      display: block;
      object-fit: cover;
      object-position: center 70%;
    }

    .profile {
      position: relative;
      padding: 22px;
    }

    .vision-section {
      padding: 18px 22px;
      border-top: 1px solid var(--line);
      border-bottom: 1px solid var(--line);
      background: #eef7f5;
    }

    .vision-label {
      margin: 0 0 5px;
      color: var(--brand-deep);
      font-size: 12px;
      font-weight: 900;
    }

    .vision-text {
      margin: 0;
      color: var(--ink);
      font-size: 16px;
      font-weight: 800;
      line-height: 1.55;
      word-break: keep-all;
    }

    .portrait-wrap {
      position: absolute;
      top: 24px;
      left: 22px;
      z-index: 2;
      width: 132px;
      height: 164px;
      border: 5px solid var(--white);
      border-radius: 22px;
      overflow: hidden;
      background: var(--white);
      box-shadow: 0 18px 38px rgba(18, 44, 60, 0.28);
    }

    .portrait {
      width: 100%;
      height: 100%;
      object-fit: cover;
      object-position: center top;
      display: block;
    }

    .identity {
      margin-top: 0;
    }

    .name {
      margin: 0;
      font-size: 27px;
      line-height: 1.18;
      letter-spacing: 0;
    }

    .role {
      margin: 5px 0 0;
      color: var(--brand-deep);
      font-size: 14px;
      font-weight: 800;
    }

    .quick-grid {
      margin-top: 18px;
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 9px;
    }

    .quick {
      min-height: 72px;
      padding: 11px 6px 10px;
      display: grid;
      place-items: center;
      gap: 5px;
      border: 1px solid var(--line);
      border-radius: 18px;
      background: #fff;
      color: var(--ink);
      font-size: 12px;
      font-weight: 800;
      cursor: pointer;
      transition: transform .18s ease, border-color .18s ease, box-shadow .18s ease;
    }

    .quick:hover {
      transform: translateY(-2px);
      border-color: rgba(23,111,122,0.35);
      box-shadow: 0 12px 26px rgba(23,111,122,0.12);
    }

    .icon {
      width: 25px;
      height: 25px;
      display: block;
      color: var(--brand);
    }

    .section {
      padding: 20px 22px;
      border-top: 1px solid var(--line);
    }

    .section-title {
      margin: 0 0 12px;
      color: var(--muted);
      font-size: 13px;
      font-weight: 900;
    }

    .info-list {
      display: grid;
      gap: 10px;
    }

    .info-row {
      display: grid;
      grid-template-columns: 28px 1fr;
      gap: 10px;
      align-items: start;
      padding: 13px;
      border: 1px solid var(--line);
      border-radius: 18px;
      background: rgba(255,255,255,0.82);
    }

    .info-label {
      margin: 0;
      color: var(--muted);
      font-size: 12px;
      font-weight: 800;
    }

    .info-value {
      margin: 1px 0 0;
      font-size: 15px;
      font-weight: 750;
      word-break: keep-all;
    }

    .actions {
      display: grid;
      gap: 10px;
    }

    .primary,
    .secondary {
      min-height: 52px;
      padding: 0 17px;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 9px;
      border-radius: 17px;
      font-weight: 900;
      cursor: pointer;
      transition: transform .18s ease, box-shadow .18s ease;
    }

    .primary {
      border: 0;
      color: #fff;
      background: linear-gradient(135deg, var(--brand), var(--brand-deep));
      box-shadow: 0 16px 34px rgba(23,111,122,0.25);
    }

    .secondary {
      border: 1px solid var(--line);
      color: var(--ink);
      background: #fff;
    }

    .youtube-personal {
      border: 0;
      color: #fff;
      background: #e62117;
      box-shadow: 0 14px 30px rgba(230, 33, 23, 0.22);
    }

    .primary:hover,
    .secondary:hover,
    .youtube-personal:hover {
      transform: translateY(-2px);
    }

    .map-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
    }

    .footer {
      padding: 18px 22px 22px;
      color: var(--muted);
      font-size: 12px;
      text-align: center;
      border-top: 1px solid var(--line);
    }

    .toast {
      position: fixed;
      left: 50%;
      bottom: 22px;
      z-index: 20;
      padding: 12px 15px;
      border-radius: 999px;
      color: #fff;
      background: rgba(15, 23, 42, 0.9);
      transform: translate(-50%, 24px);
      opacity: 0;
      pointer-events: none;
      transition: opacity .2s ease, transform .2s ease;
      font-size: 13px;
      font-weight: 800;
      white-space: nowrap;
    }

    .toast.show {
      opacity: 1;
      transform: translate(-50%, 0);
    }

    @media (max-width: 380px) {
      .page {
        padding: 14px 10px;
      }

      .hero {
        min-height: 230px;
        padding: 19px;
      }

      .hero-title {
        font-size: 29px;
      }

      .profile,
      .section {
        padding-left: 18px;
        padding-right: 18px;
      }

      .quick-grid {
        grid-template-columns: repeat(2, 1fr);
      }
    }
  </style>
</head>

  <div class="toast" id="toast" role="status" aria-live="polite">완료되었습니다.</div>

  <script>
    const toast = document.getElementById('toast');
    const address = '서울시 서초구 청계산로 9길 66';
    const phone = '010-6334-9717';
    const homepage = 'https://www.onyouchurch.kr/';
    const youtube = 'https://www.youtube.com/@onyouchurch2023';
    const personalYoutube = 'https://www.youtube.com/@%EC%9C%A4%EC%83%81%EC%98%81%EB%AA%A9%EC%82%AC-%EC%98%A8%EC%9C%A0%EA%B5%90%ED%9A%8C';

    function showToast(message) {
      toast.textContent = message;
      toast.classList.add('show');
      window.clearTimeout(showToast.timer);
      showToast.timer = window.setTimeout(() => toast.classList.remove('show'), 1800);
    }

    document.getElementById('copyAddress').addEventListener('click', async () => {
      try {
        await navigator.clipboard.writeText(address);
        showToast('주소가 복사되었습니다.');
      } catch (error) {
        const area = document.createElement('textarea');
        area.value = address;
        document.body.appendChild(area);
        area.select();
        document.execCommand('copy');
        document.body.removeChild(area);
        showToast('주소가 복사되었습니다.');
      }
    });

    document.getElementById('saveContact').addEventListener('click', async () => {
      const vcard = [
        'BEGIN:VCARD',
        'VERSION:3.0',
        'FN:윤상영 담임목사',
        'ORG:대한예수교장로회 온유교회',
        'TITLE:담임목사',
        'TEL;TYPE=CELL,VOICE:' + phone,
        'ADR;TYPE=WORK:;;' + address + ';;;;',
        'URL:' + homepage,
        'URL;TYPE=YouTube:' + youtube,
        'URL;TYPE=YouTube-Personal:' + personalYoutube,
        'NOTE:사람을 살리고, 사람을 치유하고, 사람을 키우는 교회',
        'END:VCARD'
      ].join('\n');
      const blob = new Blob([vcard], { type: 'text/vcard;charset=utf-8' });
      const fileName = '윤상영담임목사-온유교회.vcf';

      if (navigator.share && navigator.canShare) {
        const file = new File([blob], fileName, { type: 'text/vcard' });
        if (navigator.canShare({ files: [file] })) {
          try {
            await navigator.share({
              files: [file],
              title: '윤상영 담임목사 · 온유교회 연락처',
              text: '대한예수교장로회 온유교회 연락처입니다.'
            });
            return;
          } catch (error) {
          }
        }
      }

      const url = URL.createObjectURL(blob);
      const link = document.createElement('a');
      link.href = url;
      link.download = fileName;
      document.body.appendChild(link);
      link.click();
      document.body.removeChild(link);
      URL.revokeObjectURL(url);
      showToast('연락처 파일이 저장되었습니다.');
    });
  </script>
